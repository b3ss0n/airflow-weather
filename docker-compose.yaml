# Лёгкое окружение Airflow 3 для обучения: LocalExecutor, без Celery и Redis.
# Запуск: docker compose up -d   ->   UI на http://localhost:8080

x-airflow-common: &airflow-common
  # Свой образ из ./Dockerfile: базовый Airflow + pytest
  image: airflow-weather:local
  build:
    context: .
    args:
      AIRFLOW_IMAGE: ${AIRFLOW_IMAGE:-apache/airflow:3.3.0}
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
    # Airflow 3: задачи общаются с api-server через Execution API
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Один общий секрет для всех сервисов, иначе задачи не пройдут авторизацию
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    # Учебный режим: вход в UI без логина и пароля
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    # Connection к базе weather: Airflow превращает AIRFLOW_CONN_<ID> в Connection с id weather_db
    AIRFLOW_CONN_WEATHER_DB: postgresql://weather:${WEATHER_DB_PASSWORD}@postgres:5432/weather
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./tests:/opt/airflow/tests
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
      WEATHER_DB_PASSWORD: ${WEATHER_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Скрипт создаёт базу weather для данных проекта (выполняется только при первом запуске)
      - ./postgres/init-weather-db.sh:/docker-entrypoint-initdb.d/init-weather-db.sh:ro
    ports:
      - "5432:5432"  # чтобы подключаться к базе из DBeaver/DataGrip
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_DB_USER}", "-d", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: db migrate
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
